<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Página com WhatsApp</title>
  <style>
    /* Estilos básicos da página */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px;
      background-color: #f4f4f9;
      color: #333;
    }

    /* Estilos do Botão do WhatsApp */
    .whatsapp-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 60px;
      height: 60px;
      background-color: #25d366;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
      z-index: 1000;
      transition: transform 0.3s ease, background-color 0.3s ease;
    }

    .whatsapp-button:hover {
      transform: scale(1.1);
      background-color: #20ba5a;
    }

    .whatsapp-button img {
      width: 35px;
      height: 35px;
    }
  </style>
</head>
<body>

  <h1>Bem-vindo ao meu site!</h1>
  <p>Clique no botão no canto inferior direito para falar conosco pelo WhatsApp.</p>

  <!-- Botão do WhatsApp -->
  <a href="https://wa.me/5500000000000?text=Ol%C3%A1!%20Gostaria%20de%20mais%20informa%C3%A7%C3%B5es." 
     class="whatsapp-button" 
     target="_blank" 
     rel="noopener noreferrer"
     aria-label="Falar no WhatsApp">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="Ícone do WhatsApp">
  </a>

</body>
</html>
