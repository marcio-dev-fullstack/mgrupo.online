<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>UNIFATIX - Login do Portal</title>
    <style>
        body { background: #0f172a; color: #fff; font-family: sans-serif; display: flex; height: 100vh; align-items: center; justify-content: center; margin: 0; }
        .card-login { background: #1e293b; padding: 2.5rem; border-radius: 12px; border: 1px solid #334155; width: 340px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        input { width: 100%; padding: 0.8rem; margin: 0.5rem 0 1.2rem 0; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 0.8rem; background: #0066ff; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card-login">
        <h2 style="text-align: center; color: #00f0ff;">UNIFATIX Portal</h2>
        <form onsubmit="event.preventDefault(); window.location.href='index.html';">
            <label>Usuário:</label>
            <input type="text" value="kesia" required>
            <label>Senha:</label>
            <input type="password" value="12345678" required>
            <button type="submit">Entrar na Área do Aluno</button>
        </form>
    </div>
</body>
</html>
