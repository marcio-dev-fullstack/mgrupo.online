            --bg-card: #1e293b;

            --accent-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 60px;
        }

        /* HEADER & LOGO MAZZ */
        header {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-mazz {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 1.8rem;
            letter-spacing: -1px;
            color: #fff;
            text-decoration: none;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-green));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.2rem;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .logo-text span {
            color: var(--accent-green);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .location-badge {
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .btn-aluno {
            background: linear-gradient(135deg, var(--accent-blue), #2563eb);
            color: #fff;
            padding: 8px 18px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            transition: all 0.3s ease;
        }

        .btn-aluno:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(59, 130, 246, 0.5);
            color: #fff;
        }

        /* HERO SECTION */
        .hero {
            text-align: center;
            padding: 3.5rem 1rem 2rem;
            max-width: 900px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #fff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }

        /* CONTROLES E BUSCA */
        .controls-container {
            max-width: 1200px;
            margin: 0 auto 2rem;
            padding: 0 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box input {
            width: 100%;
            padding: 1rem 1.5rem 1rem 3rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .search-box i {
            position: absolute;
            left: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .category-tabs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 8px;
            scroll-behavior: smooth;
        }

        .tab-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .tab-btn:hover, .tab-btn.active {
            background: var(--accent-blue);
            color: #fff;
            border-color: var(--accent-blue);
        }

        /* GRID DE CURSOS */
        .courses-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .course-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .course-card:hover {
            transform: translateY(-4px);
            border-color: rgba(59, 130, 246, 0.4);
        }

        .course-header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .course-num {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 700;
        }

        .course-category {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            color: var(--accent-green);
        }

        .course-title {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #fff;
        }

        .course-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
            margin-top: auto;
        }

        .course-duration {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-enroll {
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent-green);
            border: 1px solid rgba(16, 185, 129, 0.2);
            padding: 6px 12px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-enroll:hover {
            background: var(--accent-green);
            color: #fff;
        }

        /* FLOATING WHATSAPP */
        .whatsapp-float {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background-color: #25d366;
            color: #fff;
            border-radius: 50px;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.4);
            z-index: 1000;
            transition: transform 0.3s ease;
        }

        .whatsapp-float:hover {
            transform: scale(1.05);
        }

            font-size: 1.5rem;
        }

        @media (max-width: 600px) {
            .hero h1 { font-size: 2rem; }
            header { flex-direction: column; gap: 12px; align-items: flex-start; }
            .header-actions { width: 100%; justify-content: space-between; }
            .whatsapp-float span { display: none; }
            .whatsapp-float { padding: 15px; border-radius: 50%; }
        }

        // Mapeamento e estruturação dos dados
        const coursesData = rawCoursesData.map(item => {
            const id = item[0];
            const fullName = item[1];
            const hours = item[2];

            let category = "Geral";
            let title = fullName;

            if (fullName.includes(": ")) {
                const parts = fullName.split(": ");
                category = parts[0];
                title = parts.slice(1).join(": ");
            } else if (fullName.startsWith("NR-")) {
                category = "NR";
                title = fullName;
            }

            return { id, category, title, fullName, hours };
        });

        let activeCategory = 'all';

        function renderCourses(filterText = '') {
            const grid = document.getElementById('coursesGrid');
            grid.innerHTML = '';

            const filtered = coursesData.filter(course => {
                const matchesCat = activeCategory === 'all' || course.category.toLowerCase().includes(activeCategory.toLowerCase());
                const matchesSearch = course.fullName.toLowerCase().includes(filterText.toLowerCase());
                return matchesCat && matchesSearch;
            });

            filtered.forEach(course => {
                const card = document.createElement('div');
                card.className = 'course-card';
                
                const encodedMsg = encodeURIComponent(`Olá! Quero saber mais sobre o curso (#${course.id}): ${course.fullName}`);
                const whatsappUrl = `https://wa.me/5565996108749?text=${encodedMsg}`;

                card.innerHTML = `
                    <div>
                        <div class="course-header-info">
                            <span class="course-category">${course.category}</span>
                            <span class="course-num">#${course.id}</span>
                        </div>
                        <div class="course-title">${course.title}</div>
                    </div>
                    <div class="course-footer">
                        <div class="course-duration"><i class="fa-regular fa-clock"></i> ${course.hours}</div>
                        <a href="${whatsappUrl}" target="_blank" class="btn-enroll">Matricular <i class="fa-solid fa-arrow-right"></i></a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(cat) {
            activeCategory = cat;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            renderCourses(document.getElementById('searchInput').value);
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderCourses(e.target.value);
        });

        // Inicialização
        renderCourses();
    </script>
