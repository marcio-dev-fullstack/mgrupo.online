<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENTIX | Validador de Certificados</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="valida-body">
    <div class="valida-container">
        <div class="logo">⚡ ZENTIX <span>Validador</span></div>
        <h2>Validação Oficial de Certificado</h2>
        <p>Insira o código impresso no documento para verificar a veracidade.</p>
        <div class="form-group">
            <input type="text" id="cert-code" placeholder="Ex: ZX-10-884920">
        </div>
        <button onclick="validarCertificado()" class="btn btn-primary">Validar Documento</button>
        <div id="valida-output"></div>
    </div>

    <script>
        function validarCertificado() {
            const code = document.getElementById('cert-code').value.trim();
            const out = document.getElementById('valida-output');
            if (code === 'ZX-10-884920' || code === 'ZX-33-401928') {
                out.innerHTML = `<div class="valid-box">✅ CERTIFICADO VÁLIDO!<br>Emitido para: Márcio Silva<br>Instituição: ZENTIX Treinamentos</div>`;
            } else if(code === '') {
                out.innerHTML = `<div class="invalid-box">Por favor, digite um código.</div>`;
            } else {
                out.innerHTML = `<div class="invalid-box">❌ Código não encontrado na base oficial ZENTIX.</div>`;
            }
        }
        
        const params = new URLSearchParams(window.location.search);
        if (params.get('code')) {
            document.getElementById('cert-code').value = params.get('code');
            validarCertificado();
        }
    </script>
</body>
</html>
