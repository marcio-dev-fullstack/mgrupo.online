<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>ZENTIX - Painel Administrativo</title>
    <link rel="stylesheet" href="style.css">
    <script src="auth.js"></script>
</head>
<body>
    <script>ZentixAuth.protectPage('admin');</script>

    <aside class="sidebar">
        <div>
            <div class="brand">⚡ ZENTIX ADMIN</div>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">🏠 Dashboard</a></li>
                <li><a href="admin.html" class="nav-link active">🛡️ Gestão Global</a></li>
            </ul>
        </div>
        <div class="user-profile-widget">
            <div class="user-name-display">Admin</div>
            <div class="user-role-badge badge-admin">🛡️ Admin</div>
            <button onclick="ZentixAuth.logout()" class="btn btn-danger" style="width: 100%; margin-top: 0.75rem;">Sair</button>
        </div>
    </aside>

    <main class="main-content">
        <h1>🛡️ Painel de Controle Administrativo</h1>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">Acesso Restrito: Gerenciamento de Alunos, Cursos e Exclusões</p>

        <div class="card">
            <h2>👥 Alunos Cadastrados</h2>
            <table style="width: 100%; margin-top: 1rem; border-collapse: collapse; text-align: left;">
                <thead>
                    <tr style="border-bottom: 1px solid var(--border-color);">
                        <th style="padding: 0.75rem;">Nome</th>
                        <th>E-mail</th>
                        <th>Perfil</th>
                        <th>Ação Administrativa</th>
                    </tr>
                </thead>
                <tbody>
                    <tr style="border-bottom: 1px solid var(--border-color);">
                        <td style="padding: 0.75rem;">Marcio Silva</td>
                        <td>aluno@zentix.com</td>
                        <td><span class="user-role-badge badge-aluno">Aluno</span></td>
                        <td><button onclick="alert('Aluno removido pelo administrador.')" class="btn btn-danger" style="padding: 0.3rem 0.6rem;">Deletar Aluno</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
