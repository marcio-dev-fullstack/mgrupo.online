<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENTIX Cursos | Catálogo Completo por Áreas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #0b1120;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        .header-container {
            max-width: 1240px;
            margin: 0 auto;
            padding: 2.5rem 1.5rem 1.5rem 1.5rem;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #0ea5e9;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 1.2rem;
            transition: color 0.2s;
        }
        .back-btn:hover {
            color: #38bdf8;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .header-top h1 {
            font-size: 2.1rem;
            font-weight: 800;
            margin: 0 0 0.4rem 0;
            color: #ffffff;
        }
        .header-top p {
            font-size: 1rem;
            color: #94a3b8;
            margin: 0;
        }
        .total-badge {
            background-color: rgba(14, 165, 233, 0.15);
            border: 1px solid #0ea5e9;
            color: #38bdf8;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.9rem;
        }
        .controls-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            background-color: #131c31;
            border: 1px solid #1e293b;
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 2rem;
        }
        .search-box {
            flex: 1;
            min-width: 260px;
            position: relative;
        }
        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
        }
        .search-box input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            background-color: #0b1120;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #f8fafc;
            font-size: 0.95rem;
            outline: none;
        }
        .search-box input:focus {
            border-color: #0ea5e9;
        }
        .area-select {
            min-width: 240px;
            padding: 0.75rem 1rem;
            background-color: #0b1120;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #f8fafc;
            font-size: 0.95rem;
            outline: none;
            cursor: pointer;
        }
        .area-section {
            max-width: 1240px;
            margin: 0 auto 3rem auto;
            padding: 0 1.5rem;
        }
        .area-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #38bdf8;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 0.6rem;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .area-count {
            font-size: 0.85rem;
            color: #94a3b8;
            font-weight: 600;
        }
        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.25rem;
        }
        .course-card {
            background-color: #131c31;
            border: 1px solid #1e293b;
            border-radius: 10px;
            padding: 1.4rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
        }
        .course-card:hover {
            transform: translateY(-3px);
            border-color: #0ea5e9;
        }
        .course-tag {
            display: inline-block;
            background-color: rgba(14, 165, 233, 0.12);
            color: #38bdf8;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            margin-bottom: 0.75rem;
        }
        .course-card h3 {
            font-size: 1.05rem;
            color: #f8fafc;
            margin: 0 0 0.5rem 0;
            line-height: 1.35;
        }
        .course-card p {
            font-size: 0.86rem;
            color: #94a3b8;
            margin: 0 0 1.1rem 0;
            line-height: 1.4;
        }
        .course-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #1e293b;
            padding-top: 0.9rem;
            font-size: 0.85rem;
            color: #cbd5e1;
        }
        .btn-curso {
            background-color: #0284c7;
            color: #ffffff;
            text-decoration: none;
            padding: 0.45rem 0.9rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.82rem;
            transition: background-color 0.2s;
        }
        .btn-curso:hover {
            background-color: #0369a1;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <a href="index.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i> Voltar ao Portal
        </a>
        <div class="header-top">
            <div>
                <h1>Catálogo Completo de Cursos ZENTIX</h1>
                <p>Todos os cursos de capacitação, aperfeiçoamento e qualificação profissional organizados por área.</p>
            </div>
            <span class="total-badge" id="totalCoursesBadge">Carregando cursos...</span>
        </div>

        <div class="controls-bar">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Buscar curso por nome ou palavra-chave...">
            </div>
            <select id="areaFilter" class="area-select">
                <option value="ALL">Todas as Áreas</option>
            </select>
        </div>
    </div>

    <div id="catalogContainer"></div>

    <!-- Importa o banco de dados courses-data.js com todos os cursos -->
    <script src="courses-data.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const rawList = window.coursesData || window.COURSES || window.courses || (typeof coursesData !== "undefined" ? coursesData : (typeof courses !== "undefined" ? courses : []));

            const catalogContainer = document.getElementById("catalogContainer");
            const areaFilter = document.getElementById("areaFilter");
            const searchInput = document.getElementById("searchInput");
            const totalBadge = document.getElementById("totalCoursesBadge");

            if (!Array.isArray(rawList) || rawList.length === 0) {
                totalBadge.textContent = "0 cursos carregados";
                catalogContainer.innerHTML = `<div class="area-section"><p style="color:#fca5a5;">Nenhum curso encontrado no arquivo <code>courses-data.js</code>.</p></div>`;
                return;
            }

            const areasSet = new Set();
            rawList.forEach(c => {
                const area = c.area || c.category || c.categoria || "Formação Geral";
                areasSet.add(area);
            });

            Array.from(areasSet).sort().forEach(area => {
                const opt = document.createElement("option");
                opt.value = area;
                opt.textContent = area;
                areaFilter.appendChild(opt);
            });

            function renderCatalog() {
                const term = searchInput.value.trim().toLowerCase();
                const selectedArea = areaFilter.value;

                const filtered = rawList.filter(c => {
                    const title = (c.title || c.nome || c.name || "").toLowerCase();
                    const desc = (c.description || c.descricao || "").toLowerCase();
                    const area = c.area || c.category || c.categoria || "Formação Geral";

                    const matchesSearch = !term || title.includes(term) || desc.includes(term) || area.toLowerCase().includes(term);
                    const matchesArea = selectedArea === "ALL" || area === selectedArea;

                    return matchesSearch && matchesArea;
                });

                totalBadge.textContent = `${filtered.length} cursos disponíveis`;

                const grouped = {};
                filtered.forEach(c => {
                    const area = c.area || c.category || c.categoria || "Formação Geral";
                    if (!grouped[area]) grouped[area] = [];
                    grouped[area].push(c);
                });

                catalogContainer.innerHTML = "";

                Object.keys(grouped).sort().forEach(area => {
                    const items = grouped[area];
                    const section = document.createElement("section");
                    section.className = "area-section";

                    const cardsHtml = items.map(c => {
                        const title = c.title || c.nome || c.name || "Curso Profissionalizante";
                        const desc = c.description || c.descricao || "Capacitação profissional com certificado válido em todo o território nacional.";
                        const hours = c.hours || c.cargaHoraria || c.workload || "40h a 80h";
                        const id = c.id || c.slug || "";
                        const link = c.url || c.link || (id ? `curso.html?id=${encodeURIComponent(id)}` : "curso.html");

                        return `
                            <div class="course-card">
                                <div>
                                    <span class="course-tag">${area}</span>
                                    <h3>${title}</h3>
                                    <p>${desc}</p>
                                </div>
                                <div class="course-footer">
                                    <span><i class="fa-regular fa-clock"></i> ${hours}</span>
                                    <a href="${link}" class="btn-curso">Acessar Curso</a>
                                </div>
                            </div>
                        `;
                    }).join("");

                    section.innerHTML = `
                        <div class="area-title">
                            <span>${area}</span>
                            <span class="area-count">${items.length} curso(s)</span>
                        </div>
                        <div class="courses-grid">${cardsHtml}</div>
                    `;
                    catalogContainer.appendChild(section);
                });
            }

            searchInput.addEventListener("input", renderCatalog);
            areaFilter.addEventListener("change", renderCatalog);

            renderCatalog();
        });
    </script>
</body>
</html>
