<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENTIX Cursos - Autenticação Segura</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0b1120;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: #131c31;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        .brand-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .brand-header i {
            color: #f97316;
            font-size: 1.4rem;
            margin-right: 6px;
        }
        .brand-header span {
            color: #0ea5e9;
            font-weight: 800;
            font-size: 1.3rem;
            letter-spacing: 0.5px;
        }
        .login-title {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0 0 0.4rem 0;
            color: #ffffff;
        }
        .login-subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 1.8rem;
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #cbd5e1;
            margin-bottom: 0.5rem;
        }
        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #f8fafc;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-control:focus {
            border-color: #0ea5e9;
        }
        .btn-login {
            width: 100%;
            padding: 0.85rem;
            background-color: #0284c7;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: background-color 0.2s;
        }
        .btn-login:hover {
            background-color: #0369a1;
        }
        .error-msg {
            background-color: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 0.7rem;
            border-radius: 6px;
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 1rem;
            display: none;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: #94a3b8;
            font-size: 0.85rem;
            text-decoration: none;
            transition: color 0.2s;
        }
        .back-link:hover {
            color: #0ea5e9;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="brand-header">
            <i class="fa-solid fa-bolt"></i>
            <span>ZENTIX CURSOS</span>
        </div>
        <h2 class="login-title">Área de Acesso</h2>
        <p class="login-subtitle">Entre com suas credenciais para continuar</p>

        <div id="errorMsg" class="error-msg">Usuário ou senha inválidos.</div>

        <form id="loginForm">
            <div class="form-group">
                <label for="usernameInput">Usuário ou E-mail</label>
                <input type="text" id="usernameInput" class="form-control" placeholder="admin" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="passwordInput">Senha</label>
                <input type="password" id="passwordInput" class="form-control" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-login">
                <i class="fa-solid fa-right-to-bracket"></i> Entrar
            </button>
        </form>

        <a href="index.html" class="back-link">
            <i class="fa-solid fa-arrow-left"></i> Voltar para o Portal de Cursos
        </a>
    </div>

    <script src="auth.js"></script>
</body>
</html>
