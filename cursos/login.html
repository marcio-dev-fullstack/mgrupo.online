<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>ZENTIX Cursos - Autenticação Segura</title>
    <link rel="stylesheet" href="style.css">
    <script src="auth.js"></script>
</head>
<body>
    <div class="login-container">
        <div class="brand" style="justify-content: center;">⚡ ZENTIX CURSOS</div>
        <h2 style="text-align: center; margin-bottom: 0.5rem;">Área de Acesso</h2>
        <p style="text-align: center; color: var(--text-muted); margin-bottom: 1.5rem;">Selecione seu perfil de teste para acessar</p>

        <form id="loginForm">
            <div class="form-group">
                <label>E-mail do Usuário</label>
                <input type="email" id="email" class="form-control" value="aluno@zentix.com" required>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="password" class="form-control" value="••••••••" required>
            </div>
            <div class="form-group">
                <label>Perfil de Acesso (RBAC)</label>
                <select id="roleSelect" class="form-control">
                    <option value="aluno">🎓 Aluno (Leitura / Sem Permissão de Exclusão)</option>
                    <option value="admin">🛡️ Administrador (Acesso Total + Gestão)</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Entrar na Plataforma</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const role = document.getElementById('roleSelect').value;
            const name = role === 'admin' ? 'Administrador Sistema' : 'Marcio Silva (Aluno)';

            ZentixAuth.login(email, role, name);
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
