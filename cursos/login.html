<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENTIX Cursos | Autenticação</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-branding">
            <h1>⚡ ZENTIX <span>Cursos</span></h1>
            <p>Plataforma de Treinamento Corporativo e Qualificação Profissional.</p>
            <div class="branding-features">
                <div>✔ Certificados com Validação por QR Code</div>
                <div>✔ Normas Reguladoras (NR-10, NR-33, NR-35)</div>
                <div>✔ Controle de Acesso Seguro (RBAC)</div>
            </div>
        </div>
        <div class="login-card">
            <h2>Acessar Plataforma</h2>
            <form id="login-form" onsubmit="realizarLogin(event)">
                <div class="form-group">
                    <label>E-mail Corporativo</label>
                    <input type="email" id="email" placeholder="seu.email@empresa.com" required>
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="senha" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Entrar no Sistema</button>
            </form>

            <div class="quick-login">
                <p>💡 Teste Rápido de Perfil:</p>
                <div class="quick-buttons">
                    <button onclick="preencherLogin('admin@mgrupo.online', 'admin')" class="btn-sm btn-admin-demo">Entrar como Admin</button>
                    <button onclick="preencherLogin('aluno@mgrupo.online', 'aluno')" class="btn-sm btn-student-demo">Entrar como Aluno</button>
                </div>
            </div>
        </div>
    </div>
    <script src="auth.js"></script>
</body>
</html>
