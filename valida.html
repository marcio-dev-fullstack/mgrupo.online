<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validação de Certificado - MAZZ Cursos</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .valid { background: #d4edda; color: #155724; }
        .invalid { background: #f8d7da; color: #721c24; }
        .info-group {
            text-align: left;
            margin-top: 15px;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        .info-group p {
            margin: 8px 0;
            color: #444;
        }
        .info-group strong {
            color: #1a365d;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>MAZZ Cursos e Capacitações</h2>
    <p style="color: #666; font-size: 0.9rem; margin-bottom: 20px;">Validação de Autenticidade de Certificado</p>

    <div id="result"></div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const codigo = urlParams.get('codigo');
    const aluno = urlParams.get('aluno');
    const curso = urlParams.get('curso');
    const ch = urlParams.get('ch');
    const prof = urlParams.get('prof');
    const data = urlParams.get('data');

    const resultDiv = document.getElementById('result');

    if (codigo && aluno) {
        resultDiv.innerHTML = `
            <div class="status-badge valid">✓ CERTIFICADO VÁLIDO E AUTÊNTICO</div>
            <div class="info-group">
                <p><strong>Código de Registro:</strong> ${codigo}</p>
                <p><strong>Aluno(a):</strong> ${aluno}</p>
                <p><strong>Curso:</strong> ${curso}</p>
                <p><strong>Carga Horária:</strong> ${ch} horas</p>
                <p><strong>Professor(a):</strong> ${prof}</p>
                <p><strong>Data de Conclusão:</strong> ${data}</p>
            </div>
        `;
    } else if (codigo) {
        // Tenta buscar no localStorage como fallback
        const localData = localStorage.getItem(codigo);
        if (localData) {
            const cert = JSON.parse(localData);
            resultDiv.innerHTML = `
                <div class="status-badge valid">✓ CERTIFICADO VÁLIDO E AUTÊNTICO</div>
                <div class="info-group">
                    <p><strong>Código de Registro:</strong> ${cert.codigo}</p>
                    <p><strong>Aluno(a):</strong> ${cert.aluno}</p>
                    <p><strong>Curso:</strong> ${cert.curso}</p>
                    <p><strong>Carga Horária:</strong> ${cert.ch} horas</p>
                    <p><strong>Professor(a):</strong> ${cert.professor}</p>
                    <p><strong>Data de Conclusão:</strong> ${cert.dataConclusao}</p>
                </div>
            `;
        } else {
            resultDiv.innerHTML = `
                <div class="status-badge invalid">✕ CERTIFICADO NÃO ENCONTRADO</div>
                <p>Não foi possível encontrar dados para o código informado (${codigo}).</p>
            `;
        }
    } else {
        resultDiv.innerHTML = `
            <div class="status-badge invalid">✕ NENHUM CÓDIGO INFORMADO</div>
            <p>Por favor, escaneie o QR Code no certificado ou informe o código completo de validação.</p>
        `;
    }
</script>

</body>
</html>
