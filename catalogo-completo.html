<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNIFATIX - Catálogo Completo de Cursos (70 Cursos)</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --primary: #0066ff;
            --primary-glow: #00f0ff;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
        }
        .header-nav {
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #0066ff, #00f0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }
        .search-box {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .search-box input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1.1rem;
            width: 100%;
            outline: none;
        }
        .filter-tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }
        .tag-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }
        .tag-btn.active, .tag-btn:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary-glow);
        }
        .stats-bar {
            margin-bottom: 1.5rem;
            color: var(--text-muted);
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
        }
        .grid-cursos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }
        .card-curso {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
        }
        .card-curso:hover {
            transform: translateY(-4px);
            border-color: var(--primary-glow);
        }
        .badge-cat {
            display: inline-block;
            background: rgba(0, 102, 255, 0.15);
            color: #38bdf8;
            padding: 0.3rem 0.8rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 0.8rem;
            width: fit-content;
        }
        .card-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin: 0 0 0.8rem 0;
            line-height: 1.4;
        }
        .card-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1.2rem;
        }
        .btn-acessar {
            background: linear-gradient(135deg, #0066ff, #0044cc);
            color: #fff;
            text-decoration: none;
            text-align: center;
            padding: 0.75rem;
            border-radius: 8px;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        .btn-acessar:hover {
            opacity: 0.9;
        }
        .load-more-container {
            text-align: center;
            margin: 3rem 0;
        }
        .btn-load-more {
            background: transparent;
            border: 2px solid var(--primary);
            color: #fff;
            padding: 0.8rem 2.5rem;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-load-more:hover {
            background: var(--primary);
            box-shadow: 0 0 20px rgba(0, 102, 255, 0.5);
        }
    </style>
</head>
<body>
    <header class="header-nav">
        <div class="logo">UNIFATIX / ZENTIX</div>
        <nav>
            <a href="index.html" style="color: var(--text-main); text-decoration: none; margin-right: 1.5rem;">Área do Aluno</a>
            <a href="login.html" style="color: var(--primary-glow); text-decoration: none; font-weight: 600;">Sair / Login</a>
        </nav>
    </header>

    <div class="container">
        <h1>Catálogo de Cursos & Especializações (70 Cursos)</h1>
        <p style="color: var(--text-muted);">Explore todas as áreas de Educação e Engenharia com busca instantânea e carregamento dinâmico.</p>

        <!-- Campo de Busca em Tempo Real -->
        <div class="search-box">
            <span>🔍</span>
            <input type="text" id="input-busca" placeholder="Digite o nome do curso, código (ex: NR-10, Topografia, EDU-101) ou área...">
        </div>

        <!-- Filtros por Categoria -->
        <div class="filter-tags" id="filter-tags">
            <button class="tag-btn active" data-cat="TODOS">Todos os Cursos (70)</button>
            <button class="tag-btn" data-cat="Educação - Pedagogia">Pedagogia (10)</button>
            <button class="tag-btn" data-cat="Educação Inclusiva">Educação Inclusiva (10)</button>
            <button class="tag-btn" data-cat="Engenharia de Segurança">Segurança do Trabalho (10)</button>
            <button class="tag-btn" data-cat="Engenharia Civil">Engenharia Civil (10)</button>
            <button class="tag-btn" data-cat="Engenharia Elétrica">Engenharia Elétrica (10)</button>
            <button class="tag-btn" data-cat="Engenharia Mecânica">Engenharia Mecânica (10)</button>
            <button class="tag-btn" data-cat="Engenharia Ambiental">Engenharia Ambiental (10)</button>
            <button class="tag-btn" data-cat="Engenharia de Software">Engenharia de Software (10)</button>
        </div>

        <div class="stats-bar">
            <span id="txt-contador">Exibindo 0 de 70 cursos</span>
            <span>Status da Matrícula: <strong style="color: #4ade80;">🟢 Boleto em Dia (KESIA DE OLIVEIRA QUADROS)</strong></span>
        </div>

        <!-- Grid de Cursos -->
        <div class="grid-cursos" id="grid-cursos"></div>

        <!-- Botão Carregar Mais -->
        <div class="load-more-container">
            <button id="btn-carregar-mais" class="btn-load-more">Carregar Mais Cursos 👇</button>
        </div>
    </div>

    <script src="assets/js/courses-data.js"></script>
    <script>
        let paginaAtual = 1;
        const cursosPorPagina = 9;
        let categoriaAtiva = "TODOS";
        let cursosFiltrados = [...TODOS_OS_CURSOS];

        const inputBusca = document.getElementById('input-busca');
        const gridCursos = document.getElementById('grid-cursos');
        const btnCarregarMais = document.getElementById('btn-carregar-mais');
        const txtContador = document.getElementById('txt-contador');
        const filterTags = document.getElementById('filter-tags');

        function aplicarFiltros() {
            const termo = inputBusca.value.toLowerCase().trim();
            cursosFiltrados = TODOS_OS_CURSOS.filter(curso => {
                const bateCategoria = (categoriaAtiva === "TODOS" || curso.categoria === categoriaAtiva);
                const bateBusca = (
                    curso.titulo.toLowerCase().includes(termo) ||
                    curso.codigo.toLowerCase().includes(termo) ||
                    curso.categoria.toLowerCase().includes(termo)
                );
                return bateCategoria && bateBusca;
            });
            paginaAtual = 1;
            renderizar();
        }

        function renderizar() {
            const limite = paginaAtual * cursosPorPagina;
            const exibidos = cursosFiltrados.slice(0, limite);

            if (exibidos.length === 0) {
                gridCursos.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 3rem; color: var(--text-muted);">Nenhum curso encontrado com os filtros atuais.</div>`;
                btnCarregarMais.style.display = 'none';
                txtContador.innerText = `Exibindo 0 de ${cursosFiltrados.length} cursos encontrados`;
                return;
            }

            gridCursos.innerHTML = exibidos.map(c => `
                <div class="card-curso">
                    <div>
                        <span class="badge-cat">${c.categoria}</span>
                        <h3 class="card-title">${c.codigo}: ${c.titulo}</h3>
                        <div class="card-meta">
                            ⏱️ Carga Horária: <strong>${c.cargaHoraria}</strong><br>
                            🎓 Nível: <strong>${c.nivel}</strong>
                        </div>
                    </div>
                    <a href="curso.html?id=${c.id}" class="btn-acessar">Iniciar / Acessar Curso</a>
                </div>
            `).join('');

            txtContador.innerText = `Exibindo ${exibidos.length} de ${cursosFiltrados.length} cursos encontrados (Total Geral: 70)`;

            if (limite >= cursosFiltrados.length) {
                btnCarregarMais.style.display = 'none';
            } else {
                btnCarregarMais.style.display = 'inline-block';
            }
        }

        inputBusca.addEventListener('input', aplicarFiltros);

        btnCarregarMais.addEventListener('click', () => {
            paginaAtual++;
            renderizar();
        });

        filterTags.addEventListener('click', (e) => {
            if (e.target.classList.contains('tag-btn')) {
                document.querySelectorAll('.tag-btn').forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                categoriaAtiva = e.target.getAttribute('data-cat');
                aplicarFiltros();
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            aplicarFiltros();
        });
    </script>
</body>
</html>
