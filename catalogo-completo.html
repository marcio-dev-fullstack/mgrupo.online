<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo Completo de Cursos | UNIFATIX ZENTIX</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', system-ui, sans-serif; margin: 0; padding: 0; }
    .header { background: #1e293b; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
    .header h1 { color: #00f0ff; margin: 0; font-size: 24px; }
    .user-badge { background: #0284c7; padding: 6px 14px; border-radius: 20px; font-size: 14px; font-weight: bold; }
    .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
    .search-box { margin-bottom: 30px; display: flex; gap: 15px; flex-wrap: wrap; }
    .search-input { flex: 1; min-width: 280px; padding: 14px 20px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 16px; outline: none; }
    .search-input:focus { border-color: #00f0ff; box-shadow: 0 0 10px rgba(0,240,255,0.3); }
    .category-filter { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; width: 100%; }
    .filter-btn { padding: 8px 16px; border-radius: 20px; border: 1px solid #334155; background: #1e293b; color: #94a3b8; cursor: pointer; white-space: nowrap; transition: 0.3s; }
    .filter-btn.active, .filter-btn:hover { background: #0066ff; color: #fff; border-color: #0066ff; }
    .cursos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; margin-top: 20px; }
    .card-curso { background: #1e293b; border-radius: 12px; padding: 24px; border: 1px solid #334155; transition: transform 0.2s, border-color 0.2s; display: flex; flex-direction: column; justify-content: space-between; }
    .card-curso:hover { transform: translateY(-4px); border-color: #00f0ff; }
    .badge-area { background: rgba(0, 102, 255, 0.2); color: #38bdf8; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; width: fit-content; margin-bottom: 12px; }
    .card-curso h3 { font-size: 18px; margin: 0 0 10px 0; color: #f8fafc; }
    .carga-horaria { font-size: 14px; color: #94a3b8; margin-bottom: 20px; }
    .carga-horaria strong { color: #00f0ff; }
    .btn-acessar { background: #0066ff; color: #fff; text-decoration: none; padding: 10px; text-align: center; border-radius: 6px; font-weight: bold; transition: background 0.2s; }
    .btn-acessar:hover { background: #0052cc; }
    .load-more-container { text-align: center; margin-top: 40px; }
    .btn-load-more { background: transparent; border: 2px solid #00f0ff; color: #00f0ff; padding: 12px 30px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; }
    .btn-load-more:hover { background: #00f0ff; color: #0f172a; }
  </style>
</head>
<body>

  <div class="header">
    <h1>UNIFATIX ZENTIX | Catálogo Acadêmico</h1>
    <div class="user-badge">🟢 KÉSIA DE OLIVEIRA QUADROS (Boleto em Dia)</div>
  </div>

  <div class="container">
    <h2>Catálogo Completo de Cursos (Carga Horária Padrão: 40h)</h2>
    
    <div class="search-box">
      <input type="text" id="input-busca" class="search-input" placeholder="🔍 Pesquisar por nome ou código do curso (ex: NR-10, Topografia, EDU-101)...">
      <div class="category-filter" id="container-filtros">
        <button class="filter-btn active" data-cat="todas">Todas as Áreas</button>
        <button class="filter-btn" data-cat="Pedagogia & Gestão Escolar">Pedagogia</button>
        <button class="filter-btn" data-cat="Educação Inclusiva & AEE">Educação Inclusiva</button>
        <button class="filter-btn" data-cat="Segurança do Trabalho & NRs">Segurança do Trabalho (NRs)</button>
        <button class="filter-btn" data-cat="Engenharia Civil & Agrimensura">Engenharia Civil</button>
        <button class="filter-btn" data-cat="Engenharia Elétrica & Fotovoltaica">Engenharia Elétrica</button>
        <button class="filter-btn" data-cat="Engenharia Mecânica & Automação">Engenharia Mecânica</button>
        <button class="filter-btn" data-cat="Engenharia Ambiental & Sustentabilidade">Engenharia Ambiental</button>
      </div>
    </div>

    <div id="grid-cursos" class="cursos-grid"></div>

    <div class="load-more-container">
      <button id="btn-carregar-mais" class="btn-load-more">Carregar Mais Cursos 👇</button>
    </div>
  </div>

  <script src="assets/js/courses-data.js"></script>
  <script>
    let paginaAtual = 1;
    const cursosPorPagina = 9;
    let categoriaAtual = 'todas';
    let termoBusca = '';

    function filtrarCursos() {
      return window.UNIFATIX_COURSES.filter(c => {
        const bateCategoria = categoriaAtual === 'todas' || c.categoria === categoriaAtual;
        const bateBusca = c.titulo.toLowerCase().includes(termoBusca) || c.codigo.toLowerCase().includes(termoBusca);
        return bateCategoria && bateBusca;
      });
    }

    function renderizar() {
      const container = document.getElementById('grid-cursos');
      const btn = document.getElementById('btn-carregar-mais');
      const filtrados = filtrarCursos();

      const limite = paginaAtual * cursosPorPagina;
      const exibidos = filtrados.slice(0, limite);

      if (exibidos.length === 0) {
        container.innerHTML = '<p style="color: #94a3b8; grid-column: 1/-1; text-align: center;">Nenhum curso encontrado para este filtro.</p>';
        btn.style.display = 'none';
        return;
      }

      container.innerHTML = exibidos.map(c => `
        <div class="card-curso">
          <div>
            <span class="badge-area">${c.categoria}</span>
            <h3>${c.codigo}: ${c.titulo}</h3>
            <p class="carga-horaria">Carga Horária Padrão: <strong>40h</strong></p>
          </div>
          <a href="aluno/curso.html?id=${c.id}" class="btn-acessar">Acessar Curso</a>
        </div>
      `).join('');

      if (limite >= filtrados.length) {
        btn.style.display = 'none';
      } else {
        btn.style.display = 'inline-block';
      }
    }

    document.getElementById('input-busca').addEventListener('input', (e) => {
      termoBusca = e.target.value.toLowerCase();
      paginaAtual = 1;
      renderizar();
    });

    document.getElementById('container-filtros').addEventListener('click', (e) => {
      if (e.target.classList.contains('filter-btn')) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        categoriaAtual = e.target.getAttribute('data-cat');
        paginaAtual = 1;
        renderizar();
      }
    });

    document.getElementById('btn-carregar-mais').addEventListener('click', () => {
      paginaAtual++;
      renderizar();
    });

    document.addEventListener('DOMContentLoaded', renderizar);
  </script>
</body>
</html>
